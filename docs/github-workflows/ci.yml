name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo SDK dependency compatibility
        run: npx expo install --check
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Expo project diagnostics
        run: npx expo-doctor
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Bootstrap regression tests
        run: npm run test:setup

      - name: Android JavaScript bundle
        run: npx expo export --platform android

  android-artifact:
    name: Android debug artifact audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
        working-directory: android
      - name: Audit APK contents, permissions and notices
        run: npm run audit:artifact -- android/app/build/outputs/apk/debug/app-debug.apk

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  secrets:
    name: Redacted source and history scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/scan-secrets.sh
