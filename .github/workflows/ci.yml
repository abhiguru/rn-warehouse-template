name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint & Type Check
    # Where this job runs is the repository variable CI_RUNNER (a JSON value for
    # runs-on, for example ["self-hosted","linux","x64","my-label"]). Without it,
    # and always for a pull request from a fork, it runs on a GitHub-hosted runner:
    # code from a fork never runs on the project's own machine.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo SDK dependency compatibility
        run: npx expo install --check
        env:
          EXPO_NO_TELEMETRY: '1'

      # expo-doctor is a locked devDependency (exact version); --no-install makes
      # the step fail rather than fetch an unreviewed copy from the registry.
      - name: Expo project diagnostics
        run: npx --no-install expo-doctor
        env:
          EXPO_NO_TELEMETRY: '1'

      # The ratchet: warnings may not grow. Lower the number when warnings are
      # fixed; keep it equal to release.yml (scripts/workflows.test.mjs checks).
      - name: Lint
        run: npm run lint -- --max-warnings 636

      - name: Type check
        run: npm run typecheck

      - name: Type check (strict React Native API)
        run: npm run typecheck:strict

      - name: Test type check
        run: npm run typecheck:tests

      - name: Test
        run: npm test

      - name: Bootstrap regression tests
        run: npm run test:setup

      - name: Android JavaScript bundle
        run: npx expo export --platform android

      - name: Audit the exported bundle
        run: npm run audit:artifact -- dist

  android-artifact:
    name: Android debug artifact audit
    # Where this job runs is the repository variable ANDROID_ARTIFACT_RUNNER: a
    # JSON value for runs-on, for example ["self-hosted","linux","x64","my-label"].
    # Without the variable, and always for a pull request from a fork, it runs on
    # a GitHub-hosted runner. A runner that keeps the Gradle caches between runs more than halves
    # the time; it must provide ANDROID_HOME with the command-line tools. See
    # docs/DEVELOPER_HANDOFF.md, "CI and releases". This job is not a required check.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(vars.ANDROID_ARTIFACT_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Install and verify pinned Android SDK prerequisites
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager"
          "$sdk_manager" --sdk_root="$sdk_root" \
            'platform-tools' 'platforms;android-37.0' \
            'build-tools;37.0.0' 'build-tools;35.0.0' \
            'ndk;27.1.12297006' 'ndk;27.0.12077973' 'cmake;3.22.1' </dev/null
          ANDROID_HOME="$sdk_root" node scripts/check-android-sdk.mjs
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install
      - name: Assemble debug APK
        # The Gradle distribution and the wrapper jar are checked against checksums pinned here, on
        # every runner. A Gradle version that is not in the map fails the step: add its checksums
        # (from services.gradle.org) when Expo moves to a new Gradle. Only on self-hosted runners,
        # which may have IPv6 routes that cannot connect or no route to services.gradle.org, prefer
        # IPv4, give the wrapper more time and download the same version from the GitHub mirror;
        # the pinned checksum still applies to that download.
        shell: bash
        run: |
          set -euo pipefail
          props=gradle/wrapper/gradle-wrapper.properties
          version="$(sed -n -E 's#^distributionUrl=.*/gradle-([0-9][0-9.]*)-bin\.zip$#\1#p' "$props")"
          test -n "$version" || { echo "distributionUrl in $props is not a gradle-<version>-bin.zip URL"; exit 1; }
          case "$version" in
            9.4.1)
              dist_sha=2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb
              jar_sha=55243ef57851f12b070ad14f7f5bb8302daceeebc5bce5ece5fa6edb23e1145c ;;
            *)
              echo "Gradle $version has no pinned checksums. Add its gradle-$version-bin.zip and wrapper jar sha256 from services.gradle.org to this step."
              exit 1 ;;
          esac
          echo "$jar_sha  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          sed -i '/^distributionSha256Sum=/d' "$props"
          echo "distributionSha256Sum=$dist_sha" >> "$props"
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:-} -Djava.net.preferIPv4Stack=true"
            sed -i 's/^networkTimeout=.*/networkTimeout=60000/' "$props"
            sed -i '/^distributionUrl=/d' "$props"
            echo 'distributionUrl=https\://github.com/gradle/gradle-distributions/releases/download/v'"${version}/gradle-${version}-bin.zip" >> "$props"
          fi
          ./gradlew assembleDebug
        working-directory: android
      - name: Audit picker React Native ABI compile options
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          compile_commands=(android/app/.cxx/Debug/*/*/compile_commands.json android/app/.cxx/RelWithDebInfo/*/*/compile_commands.json)
          test "${#compile_commands[@]}" -gt 0
          for command_file in "${compile_commands[@]}"; do
            node scripts/audit-picker-native-compile.mjs "$command_file"
          done
      - name: Audit APK contents, permissions and notices
        run: npm run audit:artifact -- android/app/build/outputs/apk/debug/app-debug.apk

  dependencies:
    # Where this job runs is the repository variable CI_RUNNER (a JSON value for
    # runs-on, for example ["self-hosted","linux","x64","my-label"]). Without it,
    # and always for a pull request from a fork, it runs on a GitHub-hosted runner:
    # code from a fork never runs on the project's own machine.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify dependency security backport regressions
        run: node --test scripts/security-backports.test.mjs scripts/audit-dependencies.test.mjs
      - name: Audit dependencies and verify every local security backport
        run: npm run audit:dependencies -- --report-dir "$RUNNER_TEMP/dependency-security-report"
      - name: Preserve raw audit and installed-source verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-security-report
          path: ${{ runner.temp }}/dependency-security-report
          if-no-files-found: warn

  secrets:
    name: Redacted source and history scan
    # Where this job runs is the repository variable CI_RUNNER (a JSON value for
    # runs-on, for example ["self-hosted","linux","x64","my-label"]). Without it,
    # and always for a pull request from a fork, it runs on a GitHub-hosted runner:
    # code from a fork never runs on the project's own machine.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/scan-secrets.sh
