name: Release validation and neutral APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Validate release tag
    # Where this job runs is the repository variable CI_RUNNER, as in ci.yml (a JSON value for
    # runs-on, for example ["self-hosted","linux","x64","my-label"]). Without it, a GitHub-hosted
    # runner. No fork clause is needed: a tag is pushed only by a maintainer, and a fork's tag
    # runs in the fork, with the fork's own variables.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    # Whether the terms and privacy text is the lawyer-reviewed text (WH-140): the sign job attaches the APK only when this is 'true'.
    outputs:
      legal_reviewed: ${{ steps.legal.outputs.reviewed }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Legal text review flag (WH-140)
        id: legal
        # LEGAL_TEXT_REVIEWED in src/constants/legal.ts. A missing file or constant (a branch without WH-140) counts as not reviewed.
        # The release still validates either way; only the APK attachment depends on it.
        shell: bash
        run: |
          set -euo pipefail
          reviewed=false
          if [ -f src/constants/legal.ts ] && grep -Eq '^export const LEGAL_TEXT_REVIEWED[[:space:]]*(:[[:space:]]*boolean[[:space:]]*)?=[[:space:]]*true[[:space:]]*;' src/constants/legal.ts; then
            reviewed=true
          fi
          echo "LEGAL_TEXT_REVIEWED reviewed=$reviewed"
          echo "reviewed=$reviewed" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Semantic version tag gate
        run: bash scripts/check-release.sh
      - run: npm ci
      - run: npx expo install --check
      - run: npx --no-install expo-doctor
        env:
          EXPO_NO_TELEMETRY: '1'
      - run: npm test -- --silent
      - run: npm run typecheck
      - run: npm run typecheck:tests
      # The same command and warning limit as ci.yml (scripts/workflows.test.mjs checks).
      - run: npm run lint -- --max-warnings 636
      - run: npm run test:setup
      # Every English text needs a Gujarati text at release (a pull request may leave it out).
      - run: npm run i18n:release-check
      - name: Audit dependencies and verify every local security backport
        run: npm run audit:dependencies -- --report-dir "$RUNNER_TEMP/dependency-security-report"
      - name: Preserve raw audit and installed-source verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-security-report
          path: ${{ runner.temp }}/dependency-security-report
          if-no-files-found: warn
      - run: npx expo export --platform android --max-workers 2
        env:
          EXPO_NO_DOTENV: '1'
          EXPO_NO_TELEMETRY: '1'
      - run: npm run audit:artifact -- dist

      # The neutral app build (docs/RELEASE_PREPARATION.md, "Neutral APK"). Central sign-in is off
      # (EXPO_PUBLIC_CENTRAL_ORIGIN is not set), the package and name differ from the association's
      # build, and EXPO_PUBLIC_UPDATE_URL makes this build the neutral one: its "Update app" button
      # opens the download page. No credentials are used here. Gradle's release task signs with the
      # template's debug key; the signing job below replaces that signature before anything is published.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install and verify pinned Android SDK prerequisites
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          sdk_manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager"
          "$sdk_manager" --sdk_root="$sdk_root" \
            'platform-tools' 'platforms;android-37.0' \
            'build-tools;37.0.0' 'build-tools;35.0.0' \
            'ndk;27.1.12297006' 'ndk;27.0.12077973' 'cmake;3.22.1' </dev/null
          ANDROID_HOME="$sdk_root" node scripts/check-android-sdk.mjs
      - name: Version code from the tag
        # The app.json formula, MAJOR*10000 + MINOR*100 + PATCH, so the code rises with every release and
        # a new APK installs over the old one. It must be set before prebuild, which writes it to Gradle.
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          core="${RELEASE_TAG#v}"
          core="${core%%-*}"
          IFS=. read -r major minor patch <<< "$core"
          code="$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))"
          echo "Version code $code for $RELEASE_TAG"
          echo "WAREHOUSE_ANDROID_VERSION_CODE=$code" >> "$GITHUB_ENV"
      - name: Generate the neutral Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_NO_DOTENV: '1'
          EXPO_NO_TELEMETRY: '1'
          WAREHOUSE_ANDROID_PACKAGE: in.gurucold.coldstorage
          WAREHOUSE_APP_NAME: Cold Storage
          WAREHOUSE_APP_SCHEME: coldstorage
          EXPO_PUBLIC_ANDROID_PACKAGE: in.gurucold.coldstorage
          EXPO_PUBLIC_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest
      - name: Assemble the release APK
        # Same Gradle checksum pinning as ci.yml (android-artifact).
        shell: bash
        env:
          EXPO_NO_DOTENV: '1'
          EXPO_NO_TELEMETRY: '1'
          WAREHOUSE_ANDROID_PACKAGE: in.gurucold.coldstorage
          WAREHOUSE_APP_NAME: Cold Storage
          WAREHOUSE_APP_SCHEME: coldstorage
          EXPO_PUBLIC_ANDROID_PACKAGE: in.gurucold.coldstorage
          EXPO_PUBLIC_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest
        run: |
          set -euo pipefail
          cd android
          props=gradle/wrapper/gradle-wrapper.properties
          version="$(sed -n -E 's#^distributionUrl=.*/gradle-([0-9][0-9.]*)-bin\.zip$#\1#p' "$props")"
          test -n "$version" || { echo "distributionUrl in $props is not a gradle-<version>-bin.zip URL"; exit 1; }
          case "$version" in
            9.4.1)
              dist_sha=2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb
              jar_sha=55243ef57851f12b070ad14f7f5bb8302daceeebc5bce5ece5fa6edb23e1145c ;;
            *)
              echo "Gradle $version has no pinned checksums. Add its gradle-$version-bin.zip and wrapper jar sha256 from services.gradle.org to this step and to ci.yml."
              exit 1 ;;
          esac
          cp ../node_modules/@react-native/gradle-plugin/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
          actual_jar_sha="$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)"
          if [ "$actual_jar_sha" != "$jar_sha" ]; then
            echo "gradle-wrapper.jar from @react-native/gradle-plugin has sha256 $actual_jar_sha, not the official $jar_sha for Gradle $version."
            exit 1
          fi
          sed -i '/^distributionSha256Sum=/d' "$props"
          echo "distributionSha256Sum=$dist_sha" >> "$props"
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:-} -Djava.net.preferIPv4Stack=true"
            sed -i 's/^networkTimeout=.*/networkTimeout=60000/' "$props"
            sed -i '/^distributionUrl=/d' "$props"
            echo 'distributionUrl=https\://github.com/gradle/gradle-distributions/releases/download/v'"${version}/gradle-${version}-bin.zip" >> "$props"
          fi
          ./gradlew assembleRelease
      - name: Audit APK contents, permissions and notices
        run: npm run audit:artifact -- android/app/build/outputs/apk/release/app-release.apk
      - name: Keep the APK for the signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neutral-apk-unsigned
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  # Signs and publishes. Runs on a GitHub-hosted runner (never the CI_RUNNER machine) in the protected
  # environment `neutral-apk-release`, which waits for the owner's approval. The signing key is a secret of
  # that environment, so no other job, workflow or branch can read it. No checkout: the job runs no
  # repository code. The tag release is created here, so a failed build or a rejected run publishes no APK.
  sign:
    name: Sign and publish the neutral APK
    needs: release
    # Refuses to attach the APK until the legal text is reviewed (WH-140); the job is then skipped, before any approval or secret is used.
    if: ${{ needs.release.outputs.legal_reviewed == 'true' }}
    runs-on: ubuntu-latest
    environment: neutral-apk-release
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: neutral-apk-unsigned
          path: unsigned
      - name: Sign, verify and publish
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.NEUTRAL_APK_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.NEUTRAL_APK_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.NEUTRAL_APK_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEUTRAL_APK_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ vars.NEUTRAL_APK_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64" && test -n "$KS_PASS" && test -n "$KEY_PASS" && test -n "$KEY_ALIAS" \
            || { echo "The environment's signing secrets are not all set."; exit 1; }
          test -n "$EXPECTED_CERT_SHA256" || { echo "The environment variable NEUTRAL_APK_CERT_SHA256 is not set."; exit 1; }
          keystore="$RUNNER_TEMP/neutral.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          tools="$(ls -d "${ANDROID_HOME:?}"/build-tools/* | sort -V | tail -n 1)"
          out="warehouse-${RELEASE_TAG}.apk"
          "$tools/zipalign" -c 4 unsigned/app-release.apk
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "$out" unsigned/app-release.apk
          rm -f "$keystore"
          "$tools/apksigner" verify --print-certs "$out" | tee "$RUNNER_TEMP/certs.txt"
          actual="$(sed -n -E 's/^Signer #1 certificate SHA-256 digest: ([0-9a-f]{64})$/\1/p' "$RUNNER_TEMP/certs.txt")"
          expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "The APK's signing certificate ($actual) is not the pinned neutral key ($expected). Nothing is published."
            exit 1
          fi
          sha256sum "$out" > SHA256SUMS
          cat SHA256SUMS
          # A tag with a suffix (v1.0.0-rc.1, v0.2.2-demo) is a pre-release and never "Latest": the download page
          # (releases/latest) must keep pointing at the newest plain version.
          kind=()
          case "$RELEASE_TAG" in *-*) kind=(--prerelease --latest=false) ;; esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$out" SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" "$out" SHA256SUMS ${kind[@]+"${kind[@]}"} --verify-tag --title "$RELEASE_TAG" \
              --notes "Neutral Android app for facilities outside the association: download ${out}, check it against SHA256SUMS, and see the README, \"Install the app\"."
          fi

  # When the build succeeded but the signing was rejected or failed, the tag's release says so.
  no-apk-notice:
    name: Note on the release that no APK was published
    needs: [release, sign]
    if: ${{ always() && needs.release.result == 'success' && needs.sign.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NOTE: >-
        ${{ needs.release.outputs.legal_reviewed == 'true' && 'No Android APK was published for this release: the signing step was rejected or failed. See the Release workflow run.' || 'No Android APK was published for this release: the terms and privacy text has not been reviewed by a lawyer yet (LEGAL_TEXT_REVIEWED is not true in src/constants/legal.ts).' }}
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          kind=()
          case "$RELEASE_TAG" in *-*) kind=(--prerelease --latest=false) ;; esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            body="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
            # A re-run must not add the note twice.
            if printf '%s' "$body" | grep -qF -- "$NOTE"; then
              echo "The release already carries the note."
            else
              printf '%s\n\n%s\n' "$body" "$NOTE" | gh release edit "$RELEASE_TAG" --notes-file -
            fi
          else
            gh release create "$RELEASE_TAG" ${kind[@]+"${kind[@]}"} --verify-tag --title "$RELEASE_TAG" --notes "$NOTE"
          fi
