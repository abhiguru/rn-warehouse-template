name: Release validation

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Validate release tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Semantic version tag gate
        run: bash scripts/check-release.sh
      - run: npm ci
      - run: npx expo install --check
      - run: npx --no-install expo-doctor
        env:
          EXPO_NO_TELEMETRY: '1'
      - run: npm test -- --silent
      - run: npm run typecheck
      - run: npm run typecheck:tests
      # The same command and warning limit as ci.yml (scripts/workflows.test.mjs checks).
      - run: npm run lint -- --max-warnings 636
      - run: npm run test:setup
      - name: Audit dependencies and verify every local security backport
        run: npm run audit:dependencies -- --report-dir "$RUNNER_TEMP/dependency-security-report"
      - name: Preserve raw audit and installed-source verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-security-report
          path: ${{ runner.temp }}/dependency-security-report
          if-no-files-found: warn
      - run: npx expo export --platform android --max-workers 2
        env:
          EXPO_NO_DOTENV: '1'
          EXPO_NO_TELEMETRY: '1'
      - run: npm run audit:artifact -- dist
      # Validation only. A maintainer publishes the GitHub release manually
      # after this run passes. No credentials or native binaries are uploaded.
