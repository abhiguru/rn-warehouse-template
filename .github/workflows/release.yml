name: Release validation

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Validate release tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
      - name: Semantic version tag gate
        run: bash scripts/check-release.sh
      - run: npm ci
      - run: npx expo install --check
      - run: npm test -- --silent
      - run: npm run typecheck
      - run: npx eslint . --quiet
      - run: npm run test:setup
      - name: Audit dependencies and verify every local security backport
        run: npm run audit:dependencies -- --report-dir "$RUNNER_TEMP/dependency-security-report"
      - name: Preserve raw audit and installed-source verification
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: dependency-security-report
          path: ${{ runner.temp }}/dependency-security-report
          if-no-files-found: warn
      - run: npx expo export --platform android --max-workers 2
        env:
          EXPO_NO_DOTENV: '1'
          EXPO_NO_TELEMETRY: '1'
      # Validation only. A maintainer publishes the GitHub release manually
      # after this run passes. No credentials or native binaries are uploaded.
