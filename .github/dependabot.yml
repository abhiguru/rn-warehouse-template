version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - "*"
    # These packages are pinned by the postinstall security backports
    # (scripts/security-backports.json, applied by
    # scripts/patch-security-backports.mjs and re-checked by
    # `npm run verify:backports`). A Dependabot bump of any of them makes the
    # exact-pin patches fail closed, so they are updated by hand together with
    # the backport manifest.
    ignore:
      - dependency-name: "@expo/cli"
      - dependency-name: "query-string"
      - dependency-name: "node-forge"
      - dependency-name: "braces"
      - dependency-name: "sprintf-js"
      - dependency-name: "metro-file-map"
      - dependency-name: "metro*"
      # Expo SDK packages move together. Their versions come from the SDK
      # (`npx expo install --check` fails CI on any other version), so they
      # are updated by hand in one SDK upgrade, not one by one.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "babel-preset-expo"
      - dependency-name: "jest-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-svg"
      - dependency-name: "@expo/vector-icons"
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@react-native-community/datetimepicker"
      - dependency-name: "@react-native-community/netinfo"
      - dependency-name: "@react-native-community/slider"
      - dependency-name: "@react-native-picker/picker"
      - dependency-name: "@sentry/react-native"
      - dependency-name: "@shopify/flash-list"
      - dependency-name: "@types/react"
      - dependency-name: "typescript"
      # Jest and Babel majors follow jest-expo and babel-preset-expo.
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
